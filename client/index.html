<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#2c2350" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icon.svg" />
  <link rel="apple-touch-icon" href="icon-192.png" />
  <link rel="preload" href="fonts/huninn.woff2" as="font" type="font/woff2" crossorigin />
  <title>奧客退散 FUCustomer</title>
  <style>
    /* 奧客退散 UI: chunky cartoon game style (cream panels, thick ink outlines, pressable buttons). Landscape first. */
    @font-face { font-family: "Huninn"; src: url("fonts/huninn.woff2") format("woff2"); font-display: swap; }
    :root {
      --ink: #2a1f3d; --ink2: #4a3d63; --cream: #fff6e5; --cream2: #ffe8c2; --paper: #fffdf7;
      --text: #2a1f3d; --muted: #85789b; --line: rgba(42,31,61,.16);
      --accent: #ff5d5d; --accent-d: #c63a3a; --good: #39c96b; --good-d: #22914c; --warn: #ffc23d; --warn-d: #cf8f00;
      --info: #48a6ff; --info-d: #2a72c2; --purple: #8f6bff; --purple-d: #5f43c4; --bad: #ff5d5d;
      --bg: #2c2350; --panel: var(--cream);
      --safe-l: env(safe-area-inset-left, 0px); --safe-r: env(safe-area-inset-right, 0px); --safe-t: env(safe-area-inset-top, 0px); --safe-b: env(safe-area-inset-bottom, 0px);
      --font: "Huninn", "PingFang TC", "Microsoft JhengHei", "Noto Sans TC", system-ui, sans-serif;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg); color: var(--text); font-family: var(--font);
      user-select: none; -webkit-user-select: none; touch-action: none; overscroll-behavior: none; }
    canvas#view { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
    button { font: inherit; color: inherit; cursor: pointer; }
    .hidden { display: none !important; }
    b, strong, h1, h2, h3 { font-weight: 900; }

    /* ---------- screens ---------- */
    .screen { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; z-index: 30; overflow-y: auto;
      padding: max(14px, var(--safe-t)) max(18px, var(--safe-r)) max(14px, var(--safe-b)) max(18px, var(--safe-l));
      background:
        radial-gradient(ellipse at 20% 15%, rgba(255,93,93,.35) 0%, transparent 45%),
        radial-gradient(ellipse at 85% 90%, rgba(72,166,255,.3) 0%, transparent 50%),
        repeating-linear-gradient(-45deg, #2c2350 0 34px, #322858 34px 68px); }
    .screen.overlay { background: rgba(28, 20, 48, .62); backdrop-filter: blur(3px); }
    .card { position: relative; background: var(--cream); color: var(--text); border: 4px solid var(--ink); border-radius: 26px; padding: 20px 22px;
      width: min(560px, 100%); max-height: 100%; overflow-y: auto; box-shadow: 0 9px 0 var(--ink), 0 22px 40px rgba(0,0,0,.35); animation: cardin .28s cubic-bezier(.2,1.4,.4,1) both; }
    .card.wide { width: min(940px, 100%); }
    .card.career { animation: none; }
    @keyframes cardin { from { transform: translateY(18px) scale(.96); opacity: 0; } to { transform: none; opacity: 1; } }
    .card::-webkit-scrollbar, .c-main::-webkit-scrollbar { width: 10px; }
    .card::-webkit-scrollbar-thumb, .c-main::-webkit-scrollbar-thumb { background: var(--cream2); border: 2px solid var(--ink); border-radius: 10px; }
    .title { font-size: clamp(34px, 6vw, 56px); margin: 0; letter-spacing: 2px; text-align: center; color: #fff;
      -webkit-text-stroke: 7px var(--ink); paint-order: stroke fill; text-shadow: 0 6px 0 var(--ink); }
    .title span { color: var(--warn); }
    .subtitle { text-align: center; color: var(--muted); margin: 4px 0 18px; }
    h2 { margin: -4px 0 14px; font-size: 22px; display: inline-block; background: var(--accent); color: #fff; padding: 4px 16px; border: 3px solid var(--ink);
      border-radius: 14px; box-shadow: 0 4px 0 var(--ink); transform: rotate(-1.5deg); }
    h3 { margin: 16px 0 8px; font-size: 16px; color: var(--ink2); }
    p { line-height: 1.55; }

    .btn { --b: #fff; --bd: var(--ink); display: block; width: 100%; padding: 12px 16px; margin: 10px 0; border-radius: 16px; border: 3px solid var(--ink);
      background: var(--b); color: var(--ink); font-size: 17px; font-weight: 900; text-align: center; letter-spacing: .5px;
      box-shadow: 0 5px 0 var(--ink), inset 0 -4px 0 rgba(0,0,0,.08), inset 0 3px 0 rgba(255,255,255,.55);
      transition: transform .07s, box-shadow .07s, filter .15s; position: relative; top: 0; }
    .btn:hover { filter: brightness(1.06); transform: translateY(-1px); box-shadow: 0 6px 0 var(--ink), inset 0 -4px 0 rgba(0,0,0,.08), inset 0 3px 0 rgba(255,255,255,.55); }
    .btn:active { transform: translateY(4px); box-shadow: 0 1px 0 var(--ink), inset 0 -2px 0 rgba(0,0,0,.08); }
    .btn.primary { --b: var(--accent); color: #fff; text-shadow: 0 2px 0 rgba(0,0,0,.25); }
    .btn.good { --b: var(--good); color: #fff; text-shadow: 0 2px 0 rgba(0,0,0,.25); }
    .btn.warn { --b: var(--warn); }
    .btn.info { --b: var(--info); color: #fff; text-shadow: 0 2px 0 rgba(0,0,0,.25); }
    .btn.purple { --b: var(--purple); color: #fff; text-shadow: 0 2px 0 rgba(0,0,0,.25); }
    .btn.small { white-space: nowrap; display: inline-block; width: auto; padding: 7px 13px; font-size: 14px; margin: 5px 4px; border-radius: 12px; box-shadow: 0 4px 0 var(--ink); }
    .btn.small:active { box-shadow: 0 1px 0 var(--ink); transform: translateY(3px); }
    .btn:disabled { filter: grayscale(.8) brightness(.95); opacity: .6; cursor: not-allowed; transform: none; }
    .btn.armed { --b: #e03131 !important; color: #fff !important; animation: shake .3s; }
    @keyframes shake { 25% { transform: translateX(-3px); } 75% { transform: translateX(3px); } }
    .row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
    .row > * { flex: 1; }
    input[type=text], select { width: 100%; padding: 11px 12px; border-radius: 14px; border: 3px solid var(--ink); background: var(--paper); color: var(--ink);
      font: inherit; font-size: 17px; font-weight: 700; user-select: text; -webkit-user-select: text; box-shadow: inset 0 3px 0 rgba(42,31,61,.08); }
    input[type=text]:focus, select:focus { outline: none; border-color: var(--info-d); box-shadow: 0 0 0 4px rgba(72,166,255,.3); }
    input.code { text-transform: uppercase; letter-spacing: 6px; text-align: center; font-size: 24px; font-weight: 900; }
    label.field { display: block; margin: 10px 0; color: var(--ink2); font-size: 14px; font-weight: 700; }
    label.field > * { margin-top: 4px; }
    input[type=range] { width: 100%; accent-color: var(--accent); }
    input[type=checkbox], input[type=radio] { accent-color: var(--accent); width: 18px; height: 18px; vertical-align: -3px; }
    .muted { color: var(--muted); font-size: 13px; }
    .err { color: #d6336c; min-height: 20px; font-size: 14px; font-weight: 700; }
    .players { list-style: none; padding: 0; margin: 10px 0; }
    .players li { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 14px; background: var(--paper); border: 3px solid var(--ink); margin: 8px 0; }
    .dot { width: 14px; height: 14px; border-radius: 50%; flex: 0 0 14px; border: 2px solid var(--ink); }
    .tag { font-size: 12px; padding: 2px 9px; border-radius: 99px; background: var(--cream2); border: 2px solid var(--ink); font-weight: 800; white-space: nowrap; color: var(--ink); }
    .tag.ok { background: #b2f2bb; }
    .tag.off { background: #ffc9c9; }
    .bigcode { font-size: 46px; font-weight: 900; letter-spacing: 10px; text-align: center; color: var(--warn); -webkit-text-stroke: 6px var(--ink); paint-order: stroke fill; margin: 6px 0; user-select: text; -webkit-user-select: text; }
    .grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 10px; }
    .shopitem { padding: 12px 14px; border-radius: 16px; background: var(--paper); border: 3px solid var(--ink); box-shadow: 0 4px 0 rgba(42,31,61,.25); }
    .shopitem b { display: block; font-size: 16px; }
    .shopitem.locked { opacity: .55; filter: grayscale(.6); }
    label.shopitem { cursor: pointer; transition: transform .1s; }
    label.shopitem:has(input:checked) { background: #fff3bf; border-color: var(--warn-d); box-shadow: 0 4px 0 var(--warn-d); transform: translateY(-2px); }
    .stat { display: flex; justify-content: space-between; gap: 10px; padding: 7px 2px; border-bottom: 2px dashed var(--line); }
    .stat b { white-space: nowrap; }

    /* ---------- title screen ---------- */
    .screen.title-bg { overflow: hidden; }
    .bgfx { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
    .bgfx span { position: absolute; font-size: 42px; opacity: .22; animation: drift linear infinite; filter: saturate(.8); }
    @keyframes drift { from { transform: translateY(110vh) rotate(0); } to { transform: translateY(-20vh) rotate(360deg); } }
    .ts { position: relative; display: grid; grid-template-columns: 1.1fr 1fr; gap: 26px; align-items: center; width: min(1020px, 100%); max-height: 100%; }
    .ts-left { text-align: center; }
    .logo { display: inline-flex; flex-direction: column; align-items: center; transform: rotate(-4deg); animation: logoin .6s cubic-bezier(.2,1.6,.4,1) both; }
    @keyframes logoin { from { transform: scale(.3) rotate(-20deg); opacity: 0; } to { transform: rotate(-4deg); opacity: 1; } }
    .logo .l1, .logo .l2 { font-size: clamp(54px, 9vw, 92px); line-height: .95; font-weight: 900; color: #fff; -webkit-text-stroke: 12px var(--ink); paint-order: stroke fill;
      text-shadow: 0 10px 0 var(--ink); letter-spacing: 4px; }
    .logo .l2 { color: var(--accent); margin-left: .9em; }
    .logo small { margin-top: 10px; font-size: 18px; font-weight: 900; letter-spacing: 6px; background: var(--warn); color: var(--ink); padding: 3px 16px; border: 3px solid var(--ink); border-radius: 99px; box-shadow: 0 4px 0 var(--ink); }
    .tagline { margin: 22px auto 10px; color: #fff; font-weight: 800; font-size: 17px; text-shadow: 0 2px 0 var(--ink); }
    .mascots { font-size: 54px; display: flex; justify-content: center; align-items: flex-end; gap: 8px; filter: drop-shadow(0 5px 0 rgba(0,0,0,.35)); }
    .mascots .vs { font-size: 30px; font-weight: 900; color: var(--warn); -webkit-text-stroke: 5px var(--ink); paint-order: stroke fill; transform: rotate(-8deg); }
    .mascots .bob { animation: bob 1.2s ease-in-out infinite alternate; display: inline-block; }
    .mascots .bob.d { animation-delay: .4s; }
    @keyframes bob { to { transform: translateY(-8px) rotate(3deg); } }
    .ts-name { max-width: 300px; margin: 12px auto 0; display: flex; gap: 8px; align-items: center; color: #fff; font-weight: 800; }
    .ts-name input { flex: 1; }
    .ts .card { width: 100%; padding: 16px 18px; }
    .ts .card .btn { margin: 9px 0; }
    .btn.hero { font-size: 22px; padding: 15px 16px; }
    .btn .sub { display: block; font-size: 12px; font-weight: 700; opacity: .85; margin-top: 2px; }
    .mp { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 6px; }
    .mp select, .mp input { font-size: 15px; padding: 9px; }
    .mp .btn { margin: 0 0 4px; padding: 0 10px; font-size: 15px; }
    .mp > * { height: 46px; }
    .sectlabel { font-size: 12px; font-weight: 900; color: var(--muted); letter-spacing: 2px; margin: 12px 0 2px; }
    .ts-foot { display: flex; align-items: center; gap: 6px; margin-top: 6px; }
    .ts-foot .muted { flex: 1; text-align: right; font-size: 11px; }
    .welcome { display: flex; flex-direction: column; gap: 4px; background: #d3f9d8; border: 3px solid var(--good-d); border-radius: 16px; padding: 10px 12px; margin: 6px 0; }
    .welcome span { font-size: 14px; }
    .welcome .btn { margin: 4px 0 2px; }

    /* ---------- HUD ---------- */
    #hud { position: fixed; inset: 0; pointer-events: none; z-index: 10; }
    .panel, .pill, #shiftbar, #burst, .feedline, .toast { background: rgba(255,246,229,.94); color: var(--ink); border: 3px solid var(--ink); box-shadow: 0 4px 0 rgba(42,31,61,.55); }
    #minimap { position: absolute; left: calc(10px + var(--safe-l)); top: calc(10px + var(--safe-t)); border-radius: 16px; border: 3px solid var(--ink); background: rgba(255,246,229,.88); box-shadow: 0 4px 0 rgba(42,31,61,.55); }
    #topbar { position: absolute; top: calc(10px + var(--safe-t)); left: 50%; transform: translateX(-50%); display: flex; gap: 8px; }
    .pill { border-radius: 999px; padding: 5px 14px; font-weight: 900; font-size: 16px; white-space: nowrap; }
    #h-money { background: #fff3bf; } #h-clock { background: #d0ebff; }
    #rightinfo { position: absolute; right: calc(10px + var(--safe-r)); top: calc(10px + var(--safe-t)); width: 214px; display: flex; flex-direction: column; gap: 8px; }
    .panel { border-radius: 16px; padding: 8px 11px; font-size: 13px; font-weight: 700; }
    .stockrow { display: flex; justify-content: space-between; gap: 6px; }
    .bar { height: 9px; background: rgba(42,31,61,.14); border-radius: 6px; overflow: hidden; margin: 3px 0 6px; border: 2px solid var(--ink); }
    .bar > i { display: block; height: 100%; background: var(--info); border-radius: 3px; box-shadow: inset 0 -3px 0 rgba(0,0,0,.15), inset 0 2px 0 rgba(255,255,255,.4); transition: width .3s; }
    #crosshair { position: absolute; left: 50%; top: 50%; width: 10px; height: 10px; margin: -5px 0 0 -5px; border-radius: 50%; background: #fff; border: 2px solid var(--ink); }
    #prompt { position: absolute; left: 50%; top: 58%; transform: translateX(-50%); text-align: center; color: #fff; font-weight: 900; font-size: 20px; white-space: nowrap;
      -webkit-text-stroke: 5px var(--ink); paint-order: stroke fill; }
    #prompt .key { display: inline-block; min-width: 30px; padding: 1px 8px; margin-right: 8px; border-radius: 9px; background: #fff; color: var(--ink); -webkit-text-stroke: 0;
      border: 3px solid var(--ink); box-shadow: 0 4px 0 var(--ink); font-size: 17px; vertical-align: 2px; }
    #prompt .sub { font-size: 15px; color: #ffe066; margin-top: 6px; }
    #progress { position: absolute; left: 50%; top: 66%; width: 200px; margin-left: -100px; height: 16px; border-radius: 10px; background: rgba(255,246,229,.9); overflow: hidden; border: 3px solid var(--ink); }
    #progress > i { display: block; height: 100%; background: var(--good); width: 0; box-shadow: inset 0 -4px 0 rgba(0,0,0,.15); }
    #held { position: absolute; right: calc(16px + var(--safe-r)); bottom: calc(16px + var(--safe-b)); }
    #toasts { position: absolute; left: 50%; top: calc(56px + var(--safe-t)); transform: translateX(-50%); display: flex; flex-direction: column; align-items: center; gap: 6px; width: min(640px, 70vw); }
    .toast { padding: 6px 16px 6px 14px; border-radius: 14px; border-left-width: 10px; border-left-color: var(--info); font-weight: 800; font-size: 15px; animation: toastin .3s cubic-bezier(.2,1.5,.4,1); }
    .toast.good { border-left-color: var(--good); } .toast.bad { border-left-color: var(--accent); background: #fff0f0; }
    /* after-story bubble once a signature karen is dealt with (who says it + the line) */
    #aftermath { position: absolute; left: calc(16px + var(--safe-l, 0px)); top: 42%; max-width: min(360px, 40vw); display: flex; gap: 8px; align-items: flex-start; pointer-events: none; animation: toastin .35s cubic-bezier(.2,1.5,.4,1); transition: opacity .4s; }
    #aftermath.fade { opacity: 0; }
    #aftermath .af-ico { flex: none; width: 46px; height: 46px; border-radius: 50%; display: grid; place-items: center; font-size: 26px; background: #fff3bf; border: 3px solid var(--ink); box-shadow: 0 3px 0 rgba(42,31,61,.55); }
    #aftermath .af-txt { position: relative; background: rgba(255,246,229,.96); color: var(--ink); border: 3px solid var(--ink); border-radius: 14px; box-shadow: 0 4px 0 rgba(42,31,61,.55); padding: 6px 12px 7px; font-weight: 800; font-size: 14px; line-height: 1.35; }
    #aftermath .af-txt::before { content: ''; position: absolute; left: -9px; top: 14px; width: 12px; height: 12px; background: inherit; border-left: 3px solid var(--ink); border-bottom: 3px solid var(--ink); transform: rotate(45deg); }
    #aftermath .af-who { display: block; font-size: 12px; color: #845ef7; }
    #aftermath.fail .af-who { color: #e03131; }
    body.touch #aftermath { top: calc(150px + var(--safe-t)); max-width: 44vw; }
    body.touch #aftermath .af-txt { font-size: 12px; padding: 4px 9px 5px; }
    body.touch #aftermath .af-ico { width: 34px; height: 34px; font-size: 19px; }
    @keyframes toastin { from { opacity: 0; transform: translateY(-10px) scale(.9); } to { opacity: 1; transform: none; } }
    @keyframes fadein { from { opacity: 0; transform: translateY(-6px); } to { opacity: 1; } }
    #feed { position: absolute; left: calc(10px + var(--safe-l)); top: calc(156px + var(--safe-t)); width: 240px; display: flex; flex-direction: column; gap: 5px; }
    .feedline { padding: 4px 9px; border-radius: 12px; font-size: 13px; font-weight: 700; border-width: 2px; box-shadow: 0 3px 0 rgba(42,31,61,.45); }
    #alert { position: absolute; left: 50%; bottom: calc(124px + var(--safe-b)); transform: translateX(-50%); background: var(--accent); color: #fff; border: 3px solid var(--ink); box-shadow: 0 5px 0 var(--ink);
      padding: 8px 18px; border-radius: 16px; font-weight: 900; text-align: center; max-width: 80vw; text-shadow: 0 2px 0 rgba(0,0,0,.3); animation: alertpulse 1s ease-in-out infinite alternate; }
    @keyframes alertpulse { to { transform: translateX(-50%) scale(1.04); } }
    #netstatus { position: absolute; left: 50%; top: 40%; transform: translate(-50%, -50%); background: var(--cream); border: 4px solid var(--ink); box-shadow: 0 6px 0 var(--ink); padding: 14px 24px; border-radius: 18px; font-weight: 900; font-size: 18px; text-align: center; }
    #phasebanner { position: absolute; left: 50%; bottom: calc(24px + var(--safe-b)); transform: translateX(-50%); display: flex; gap: 8px; pointer-events: auto; }
    #phasebanner .btn { font-size: 17px; padding: 10px 18px; }
    #fps { position: absolute; right: 6px; bottom: 4px; font-size: 11px; color: #fff; -webkit-text-stroke: 3px var(--ink); paint-order: stroke fill; }
    #helpkeys { position: absolute; left: calc(10px + var(--safe-l)); bottom: calc(10px + var(--safe-b)); font-size: 12px; color: #fff; font-weight: 700; -webkit-text-stroke: 3px rgba(42,31,61,.85); paint-order: stroke fill; line-height: 1.6; }

    /* ---------- touch controls ---------- */
    #touch { position: fixed; inset: 0; z-index: 9; pointer-events: none; }
    #touch .zone { position: absolute; top: 0; bottom: 0; pointer-events: auto; touch-action: none; }
    #touch .zone.left { left: 0; width: 42%; }
    #touch .zone.right { right: 0; width: 58%; }
    .stick-base { position: absolute; width: 132px; height: 132px; margin: -66px 0 0 -66px; border-radius: 50%; border: 4px solid rgba(42,31,61,.7); background: rgba(255,246,229,.28); pointer-events: none; }
    .stick-knob { position: absolute; left: 50%; top: 50%; width: 60px; height: 60px; margin: -30px 0 0 -30px; border-radius: 50%; background: var(--cream); border: 4px solid var(--ink); box-shadow: 0 4px 0 var(--ink); }
    .tbtn { --b: rgba(255,246,229,.88); position: absolute; pointer-events: auto; border-radius: 50%; border: 4px solid var(--ink); background: var(--b); color: var(--ink); font-weight: 900;
      display: flex; align-items: center; justify-content: center; text-align: center; touch-action: none; font-size: 14px; line-height: 1.1; box-shadow: 0 5px 0 rgba(42,31,61,.8); padding: 2px; }
    .tbtn.active { transform: translateY(4px); box-shadow: 0 1px 0 rgba(42,31,61,.8); filter: brightness(1.1); }
    #t-interact { width: 96px; height: 96px; right: calc(28px + var(--safe-r)); bottom: calc(40px + var(--safe-b)); font-size: 18px; --b: rgba(255,93,93,.92); color: #fff; text-shadow: 0 2px 0 rgba(0,0,0,.3); }
    .tbtn.long, #t-interact.long { font-size: 13px; line-height: 1.15; padding: 6px; word-break: break-all; }
    #t-item { width: 66px; height: 66px; right: calc(134px + var(--safe-r)); bottom: calc(30px + var(--safe-b)); }
    #t-alt { width: 66px; height: 66px; right: calc(40px + var(--safe-r)); bottom: calc(150px + var(--safe-b)); --b: rgba(255,194,61,.92); }
    #t-run { width: 58px; height: 58px; right: calc(152px + var(--safe-r)); bottom: calc(114px + var(--safe-b)); }
    #t-ping { width: 52px; height: 52px; right: calc(224px + var(--safe-r)); bottom: calc(36px + var(--safe-b)); }
    #t-menu, #t-chat, #t-shop { width: 46px; height: 46px; right: calc(10px + var(--safe-r)); border-radius: 14px; font-size: 18px; }
    #t-menu, #t-chat, #t-shop { top: calc(10px + var(--safe-t)); }
    #t-chat { right: calc(62px + var(--safe-r)); } #t-shop { right: calc(114px + var(--safe-r)); }
    body.touch #rightinfo { right: auto; left: calc(10px + var(--safe-l)); top: calc(118px + var(--safe-t)); width: 200px; transform: scale(.72); transform-origin: top left; }
    body.touch #minimap { width: 150px; height: 102px; }
    body.touch #topbar { transform: translateX(-50%) scale(.78); transform-origin: top center; }
    body.touch #feed { left: auto; right: calc(10px + var(--safe-r)); top: calc(66px + var(--safe-t)); width: 190px; }
    body.touch #phasebanner { bottom: auto; top: calc(52px + var(--safe-t)); }
    body.touch.shiftmode #phasebanner { top: calc(80px + var(--safe-t)); }
    body.touch:has(#phasebanner:not(:empty)) #hintbar { top: calc(128px + var(--safe-t)); }
    body.touch #phasebanner .btn { font-size: 14px; padding: 6px 12px; }
    body.touch #burst { left: calc(10px + var(--safe-l)); bottom: calc(8px + var(--safe-b)); transform: scale(.8); transform-origin: bottom left; }

    .cos-info { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
    .cos-info b { font-size: 15px; } .cos-info .muted { font-size: 12px; line-height: 1.3; }
    .cos-act { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
    .cos-act .btn { margin: 2px 0 0; padding: 4px 10px; font-size: 13px; flex: 0 0 auto; width: auto; }
    .tag.lock { background: #e5dbff; } .tag.gold { background: linear-gradient(135deg, #ffe066, #fab005); }
    .shopitem.pack { display: flex; flex-direction: column; gap: 6px; border-top: 10px solid var(--purple); }
    .shopitem.pack.focus { background: #f3f0ff; box-shadow: 0 0 0 4px var(--purple), 0 4px 0 var(--purple-d); }
    .pack-tags { display: flex; gap: 4px; flex-wrap: wrap; justify-content: center; } .pack .pack-tags { justify-content: flex-start; }
    .pack-buy { align-items: center; margin-top: auto; } .pack-buy .price { flex: 1; font-weight: 900; font-size: 13px; } .pack-buy .btn { flex: 0 0 auto; width: auto; margin: 0; }
    .lockbadge { font-style: normal; font-size: 15px; margin-left: 4px; }
    .pick { position: relative; } .pick .lockbadge { position: absolute; top: 2px; right: 4px; }
    .pick.locked span { filter: grayscale(.7); opacity: .7; }
    .mapcard.locked-pack { background: #f3f0ff; } .mapcard.locked-pack .mapicon { filter: grayscale(.6); }
    .lic-body { position: relative; }
    .lic-hat { position: absolute; left: 6px; top: -14px; font-size: 26px; transform: rotate(-14deg); filter: drop-shadow(0 2px 0 rgba(42,31,61,.35)); pointer-events: none; }
    .license.supporter { border-color: #e8a400; box-shadow: 0 0 0 3px #ffe066, 0 6px 0 var(--ink); }
    @media (max-height: 520px) {

      .cosgrid { grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 7px; }
      .cos-icon { flex-basis: 40px; height: 40px; font-size: 22px; border-radius: 10px; }
      .shopitem.cos { padding: 5px 7px; gap: 7px; } .cos-info .muted { font-size: 11px; max-height: 2.6em; overflow: hidden; }
      .lic-hat { font-size: 20px; top: -10px; }
      /* nine career tabs: two columns so they all fit next to the rank card */
      .c-side .tabs { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; } .c-side .tab { padding: 4px 6px; font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; } .c-side .tab.on { transform: none; }
    }

    /* ---------- short landscape screens (phones) ---------- */
    @media (max-height: 520px) {

      .tagline { margin: 12px auto 4px; font-size: 14px; }
      .mascots { font-size: 32px; }

      .ts .card { max-height: 100%; padding: 10px 14px; }

      .btn .sub { display: none; }
      .mp > * { height: 38px; }

      .sectlabel { margin: 6px 0 2px; }
      .err { min-height: 0; }
      .welcome { padding: 6px 10px; } .welcome span { display: none; }

      .lic-stamp { width: 44px; height: 44px; font-size: 10px; } .lic-actions { margin-top: 6px; } .logo .l1, .logo .l2 { font-size: 40px; }
      .card.career { height: 100%; }
      .c-side { flex-basis: 196px; padding: 8px; gap: 6px; }

    }
    @media (max-width: 720px) and (orientation: portrait) {

<body>
