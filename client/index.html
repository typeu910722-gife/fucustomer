  <title>奧客退散 FUCustomer</title>
  <style>
    /* 奧客退散 UI: chunky cartoon game style (cream panels, thick ink outlines, pressable buttons). Landscape first. */
    :root {
      --ink: #2a1f3d; --ink2: #4a3d63; --cream: #fff6e5; --cream2: #ffe8c2; --paper: #fffdf7;
      --text: #2a1f3d; --muted: #85789b; --line: rgba(42,31,61,.16);
      --accent: #ff5d5d; --accent-d: #c63a3a; --good: #39c96b; --good-d: #22914c; --warn: #ffc23d; --warn-d: #cf8f00;
      --info: #48a6ff; --info-d: #2a72c2; --purple: #8f6bff; --purple-d: #5f43c4; --bad: #ff5d5d;
      --bg: #2c2350; --panel: var(--cream);
      --safe-l: env(safe-area-inset-left, 0px); --safe-r: env(safe-area-inset-right, 0px); --safe-t: env(safe-area-inset-top, 0px); --safe-b: env(safe-area-inset-bottom, 0px);
      --font: "Huninn", "PingFang TC", "Microsoft JhengHei", "Noto Sans TC", system-ui, sans-serif;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg); color: var(--text); font-family: var(--font);
      user-select: none; -webkit-user-select: none; touch-action: none; overscroll-behavior: none; }
    canvas#view { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
    button { font: inherit; color: inherit; cursor: pointer; }
    .hidden { display: none !important; }
    b, strong, h1, h2, h3 { font-weight: 900; }

    /* ---------- screens ---------- */
    .screen { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; z-index: 30; overflow-y: auto;
      padding: max(14px, var(--safe-t)) max(18px, var(--safe-r)) max(14px, var(--safe-b)) max(18px, var(--safe-l));
      background:
        radial-gradient(ellipse at 20% 15%, rgba(255,93,93,.35) 0%, transparent 45%),
        radial-gradient(ellipse at 85% 90%, rgba(72,166,255,.3) 0%, transparent 50%),
        repeating-linear-gradient(-45deg, #2c2350 0 34px, #322858 34px 68px); }
    .screen.overlay { background: rgba(28, 20, 48, .62); backdrop-filter: blur(3px); }
    .card { position: relative; background: var(--cream); color: var(--text); border: 4px solid var(--ink); border-radius: 26px; padding: 20px 22px;
      width: min(560px, 100%); max-height: 100%; overflow-y: auto; box-shadow: 0 9px 0 var(--ink), 0 22px 40px rgba(0,0,0,.35); animation: cardin .28s cubic-bezier(.2,1.4,.4,1) both; }
    .card.wide { width: min(940px, 100%); }
    .card.career { animation: none; }
    @keyframes cardin { from { transform: translateY(18px) scale(.96); opacity: 0; } to { transform: none; opacity: 1; } }
    .card::-webkit-scrollbar, .c-main::-webkit-scrollbar { width: 10px; }
    .card::-webkit-scrollbar-thumb, .c-main::-webkit-scrollbar-thumb { background: var(--cream2); border: 2px solid var(--ink); border-radius: 10px; }
    .title { font-size: clamp(34px, 6vw, 56px); margin: 0; letter-spacing: 2px; text-align: center; color: #fff;
      -webkit-text-stroke: 7px var(--ink); paint-order: stroke fill; text-shadow: 0 6px 0 var(--ink); }
    .title span { color: var(--warn); }
    .subtitle { text-align: center; color: var(--muted); margin: 4px 0 18px; }
    h2 { margin: -4px 0 14px; font-size: 22px; display: inline-block; background: var(--accent); color: #fff; padding: 4px 16px; border: 3px solid var(--ink);
      border-radius: 14px; box-shadow: 0 4px 0 var(--ink); transform: rotate(-1.5deg); }
    h3 { margin: 16px 0 8px; font-size: 16px; color: var(--ink2); }
    p { line-height: 1.55; }

    .btn { --b: #fff; --bd: var(--ink); display: block; width: 100%; padding: 12px 16px; margin: 10px 0; border-radius: 16px; border: 3px solid var(--ink);
      background: var(--b); color: var(--ink); font-size: 17px; font-weight: 900; text-align: center; letter-spacing: .5px;
      box-shadow: 0 5px 0 var(--ink), inset 0 -4px 0 rgba(0,0,0,.08), inset 0 3px 0 rgba(255,255,255,.55);
      transition: transform .07s, box-shadow .07s, filter .15s; position: relative; top: 0; }
    .btn:hover { filter: brightness(1.06); transform: translateY(-1px); box-shadow: 0 6px 0 var(--ink), inset 0 -4px 0 rgba(0,0,0,.08), inset 0 3px 0 rgba(255,255,255,.55); }
    .btn:active { transform: translateY(4px); box-shadow: 0 1px 0 var(--ink), inset 0 -2px 0 rgba(0,0,0,.08); }
    .btn.primary { --b: var(--accent); color: #fff; text-shadow: 0 2px 0 rgba(0,0,0,.25); }
    .btn.good { --b: var(--good); color: #fff; text-shadow: 0 2px 0 rgba(0,0,0,.25); }
    .btn.warn { --b: var(--warn); }
    .btn.info { --b: var(--info); color: #fff; text-shadow: 0 2px 0 rgba(0,0,0,.25); }
    .btn.purple { --b: var(--purple); color: #fff; text-shadow: 0 2px 0 rgba(0,0,0,.25); }
    .btn.small { white-space: nowrap; display: inline-block; width: auto; padding: 7px 13px; font-size: 14px; margin: 5px 4px; border-radius: 12px; box-shadow: 0 4px 0 var(--ink); }
    .btn.small:active { box-shadow: 0 1px 0 var(--ink); transform: translateY(3px); }
    .btn:disabled { filter: grayscale(.8) brightness(.95); opacity: .6; cursor: not-allowed; transform: none; }
    .btn.armed { --b: #e03131 !important; color: #fff !important; animation: shake .3s; }
    @keyframes shake { 25% { transform: translateX(-3px); } 75% { transform: translateX(3px); } }
    .row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
    .row > * { flex: 1; }
    input[type=text], select { width: 100%; padding: 11px 12px; border-radius: 14px; border: 3px solid var(--ink); background: var(--paper); color: var(--ink);
      font: inherit; font-size: 17px; font-weight: 700; user-select: text; -webkit-user-select: text; box-shadow: inset 0 3px 0 rgba(42,31,61,.08); }
    textarea.bk-code { width: 100%; padding: 9px 11px; border-radius: 14px; border: 3px solid var(--ink); background: var(--paper); color: var(--ink); resize: vertical;
      font: 12px/1.35 ui-monospace, Menlo, Consolas, monospace; word-break: break-all; user-select: text; -webkit-user-select: text; box-shadow: inset 0 3px 0 rgba(42,31,61,.08); }
    textarea.bk-code:focus { outline: none; border-color: var(--info-d); }
    .bk-cmp { width: 100%; border-collapse: collapse; font-size: 14px; margin: 6px 0; }
    .bk-cmp th, .bk-cmp td { padding: 4px 6px; border-bottom: 2px dashed rgba(42,31,61,.15); text-align: left; }
    .bk-cmp th { font-size: 12px; color: var(--ink2); }
    .bk-err { color: #c92a2a; font-weight: 800; }
    .bk-warn { background: #fff3bf; border: 3px solid var(--ink); border-radius: 14px; padding: 8px 10px; font-size: 14px; }
    input[type=text]:focus, select:focus { outline: none; border-color: var(--info-d); box-shadow: 0 0 0 4px rgba(72,166,255,.3); }

    #rotate { position: fixed; inset: 0; z-index: 100; display: none; align-items: center; justify-content: center; flex-direction: column; gap: 18px; font-size: 22px; font-weight: 900; text-align: center; padding: 24px; color: #fff;
      background: repeating-linear-gradient(-45deg, #2c2350 0 34px, #322858 34px 68px); -webkit-text-stroke: 5px var(--ink); paint-order: stroke fill; }

    /* ---------- shift HUD ---------- */

      border-radius: 16px; padding: 7px 16px; font-weight: 800; font-size: 15px; text-align: center; text-shadow: 0 2px 0 rgba(0,0,0,.25); }

      --hud-chaos: #e8174a; --hud-stam: #00a0b0; --hud-stam-low: #e8174a; --ping-good: #c3f0f4; --ping-mid: #ffe0e6; --ping-bad: #ffb3c1; }
    /* 字級: scales the HUD, menus and captions (zoom keeps every layout rule, like a smaller screen) */
    #hud, #ui, #captions { zoom: var(--ui-scale); }
    .bar > i.ok { background-color: var(--hud-ok); }
    .bar > i.low, #stamina > i.low { background-color: var(--hud-low); }
    .bar > i.low, #stamina > i.low, #sb-chaosbar.crit, .bar > i.done { background-image: repeating-linear-gradient(135deg, rgba(42,31,61,.42) 0 3px, transparent 3px 7px); }
    .bar > i.done { background-image: repeating-linear-gradient(90deg, rgba(255,255,255,.55) 0 2px, transparent 2px 9px); }
    #sb-chaosbar { background-color: var(--hud-chaos); }
    #sb-moneybar { background-color: var(--hud-ok); } #sb-moneybar.done { background-color: var(--hud-good); }
    #stamina > i { background-color: var(--hud-stam); }

      <div class="panel" id="h-stock"></div>
      <div class="panel" id="h-team"></div>
    </div>
    <div id="feed"></div>
    <div id="crosshair"></div>
    <div id="prompt"></div>
    <div id="progress" class="hidden"><i></i></div>
    <div id="toasts" role="status" aria-live="polite"></div>
    <div id="alert" class="hidden"></div>
    <div id="netstatus" class="hidden"></div>
    <div id="phasebanner"></div>

      <div id="sb-moneywrap"><div class="sb-label"><span>營業額</span><span id="sb-money"></span></div><div class="bar"><i id="sb-moneybar"></i></div></div>
      <div class="sb-label"><span id="sb-chaoslabel">混亂度</span><span id="sb-chaos"></span></div><div class="bar"><i id="sb-chaosbar"></i></div>
    </div>
    <div id="burst" class="hidden"><div class="sb-label"><b>情緒爆發</b><span id="burst-num">0/100</span></div><div class="bar"><i id="burst-bar" style="background:#ff922b"></i></div><small id="burst-hint"></small></div>
    <div id="stamina"><i></i></div>
    <div id="combo" class="hidden"></div>
    <div id="stamp" class="hidden"></div>
    <div id="speedlines" class="hidden"></div>
    <div id="hintbar" class="hidden"></div>
    <div id="aftermath" class="hidden"></div>
    <button id="tutskip" class="btn small hidden">跳過教學（K）</button>
    <div id="introcard" class="hidden"></div>
    <div id="arccard" class="hidden"></div>
    <div id="eventstrip" class="hidden"></div>
    <div id="helpkeys">WASD 移動・Shift 跑・滑鼠 視角・E 互動・F 次要・G 放下・空白 抓/丟・X 出手・Q 旋風・R 全店退散・V 標記・T 訊息・B 採購・Esc 選單</div>
    <div id="fps"></div>

  <div id="touch" class="hidden">
    <div class="zone left" id="t-left"></div>
    <div class="zone right" id="t-right"></div>
    <div class="stick-base hidden" id="t-stick"><div class="stick-knob" id="t-knob"></div></div>
    <button class="tbtn" id="t-interact">互動</button>
    <button class="tbtn" id="t-item">放下</button>
    <button class="tbtn hidden" id="t-alt">次要</button>
    <button class="tbtn" id="t-run">跑</button>
    <button class="tbtn" id="t-ping">標記</button>
    <button class="tbtn" id="t-chat" aria-label="快速訊息">💬</button>
    <button class="tbtn" id="t-menu" aria-label="選單">☰</button>
    <button class="tbtn" id="t-shop" aria-label="採購">🛒</button>
    <button class="tbtn hidden" id="t-grab">抓／丟</button>
    <button class="tbtn hidden" id="t-spin">旋風</button>
    <button class="tbtn hidden" id="t-ult">退散</button>
    <button class="tbtn hidden" id="t-hit">揍</button>
  </div>

  <div id="flash"></div>
  <div id="vignette"></div>
  <div id="ui"></div>
  <div id="captions" class="hidden" role="status" aria-live="polite"></div>
